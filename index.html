<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />
        <title>СтройКласс</title>
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/fonts.css" />
        <link rel="stylesheet" href="css/style.css" />
        <script src="js/main.js" defer></script>
    </head>
    <body>
        <div class="page">
            <header class="header">
                <div class="header__container container">
                    <a class="header__logo" href="/">
                        <img
                            src="./images/icons/logo.svg"
                            alt=""
                            width="32"
                            height="32"
                        />
                        <span class="header__logo-text">СтройКласс</span>
                    </a>
                    <div class="header__menu" id="header-menu">
                        <nav class="header__nav">
                            <ul class="header__nav-list">
                                <li class="header__nav-item">
                                    <a href="#" class="header__nav-link">
                                        Услуги
                                    </a>
                                </li>
                                <li class="header__nav-item">
                                    <a href="#" class="header__nav-link">
                                        О компании
                                    </a>
                                </li>
                                <li class="header__nav-item">
                                    <a href="#" class="header__nav-link">
                                        Проекты
                                    </a>
                                </li>
                                <li class="header__nav-item">
                                    <a href="#" class="header__nav-link">
                                        Отзывы
                                    </a>
                                </li>
                                <li class="header__nav-item">
                                    <a href="#" class="header__nav-link">
                                        Контакты
                                    </a>
                                </li>
                            </ul>
                        </nav>
                        <button
                            type="button"
                            class="header__button button-primary"
                        >
                            Получить смету
                        </button>
                    </div>
                    <button
                        class="header__burger"
                        type="button"
                        aria-expanded="false"
                        aria-controls="header-menu"
                        aria-label="Открыть меню"
                    >
                        <span class="header__burger-line"></span>
                        <span class="header__burger-line"></span>
                        <span class="header__burger-line"></span>
                    </button>
                </div>
                <div class="header__overlay" data-menu-close></div>
            </header>
            <main class="main">
                <section class="hero">
                    <img class="hero__image" src="./images/hero.png" alt="" />
                    <div class="hero__overlay"></div>
                    <div class="hero__container container">
                        <div class="hero__info">
                            <span class="label">
                                Строительная компания · Москва
                            </span>
                            <h1 class="hero__text">
                                Строим. <br />
                                Ремонтируем. <br />
                                <span class="hero__text-span">
                                    Сдаём в срок.
                                </span>
                            </h1>
                            <p class="hero__description">
                                Более 16 лет опыта в строительстве и ремонте в
                                Москве и Подмосковье. 840 сданных объектов.
                                Гарантия на все виды работ.
                            </p>
                            <div class="hero__actions">
                                <button
                                    type="button"
                                    class="hero__button button-primary"
                                >
                                    Получить смету
                                </button>
                                <a
                                    href="#projects"
                                    class="hero__button button-secondary"
                                >
                                    Наши проекты
                                </a>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
